name: Release

on:
  push:
    tags: ['v*']

# No workflow-wide token rights: each job gets only what it needs.
permissions: {}

# Serialize duplicate tag pushes without cancelling a run while it owns a draft.
concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-gate:
    name: Require a green CI run for the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read        # read the CI result of the tagged commit
    steps:
      - name: Require a green CI run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # CI (lint.yml) runs on the push to main; wait for it, then publish only if it passed.
          for attempt in $(seq 1 50); do
            result=$(gh run list -R "$GITHUB_REPOSITORY" --workflow lint.yml --commit "$GITHUB_SHA" --json status,conclusion \
              --jq 'map(select(.status == "completed")) | if any(.conclusion == "success") then "success" elif length > 0 then "failure" else "pending" end')
            echo "CI for $GITHUB_SHA: $result"
            [ "$result" = "success" ] && exit 0
            [ "$result" = "failure" ] && { echo "CI failed for this commit; no release is built."; exit 1; }
            sleep 60
          done
          echo "No completed CI run for this commit after 50 minutes; no release is built."
          exit 1

  package:
    name: Build upload-ready ZIP
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Read-only: third-party setup-php receives github.token by default, so it never runs in a job that can write.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
      - name: Build package from the closed allowlist
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/barebonesforms"
          version="${GITHUB_REF_NAME#v}"
          php tools/package-deploy.php --version "$version" --destination "$out"
          php tools/package-deploy.php --version "$version" --check --destination "$out"
          rm "$out/.bbf-package"
          (cd "$RUNNER_TEMP" && zip -qr "barebonesforms-${GITHUB_REF_NAME}.zip" barebonesforms)
          # Upgrade ZIP: code, check.php, current docs.html and CHANGELOG.md (the dry run lists its Breaking notes). Uploading
          # it over FTP never overwrites your templates, sample forms or .htaccess; the new .htaccess rules come as
          # .htaccess.dist (maintenance.php upgrade uses it).
          cp "$out/.htaccess" "$out/.htaccess.dist"
          php -r '$m = json_decode(file_get_contents($argv[1]), true); foreach ($m["files"] as $p => $f) if ($f["kind"] !== "code" && $p !== "check.php" && $p !== "CHANGELOG.md" && $p !== "docs.html") unlink($argv[2] . "/" . $p);' \
            "$out/.bbf-manifest.json" "$out"
          (cd "$RUNNER_TEMP" && zip -qr "barebonesforms-${GITHUB_REF_NAME}-upgrade.zip" barebonesforms)
          # Checksums outside the ZIPs (the manifest inside only detects damage, not a substituted package).
          (cd "$RUNNER_TEMP" && sha256sum "barebonesforms-${GITHUB_REF_NAME}.zip" "barebonesforms-${GITHUB_REF_NAME}-upgrade.zip" > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          if-no-files-found: error
          retention-days: 1
          path: |
            ${{ runner.temp }}/barebonesforms-${{ github.ref_name }}.zip
            ${{ runner.temp }}/barebonesforms-${{ github.ref_name }}-upgrade.zip
            ${{ runner.temp }}/SHA256SUMS

  publish:
    name: Attest and publish release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only GitHub's own actions run here; nothing third-party sees the write token.
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # signed build provenance (gh attestation verify)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: ${{ runner.temp }}
      - name: Verify checksums of the built files
        shell: bash
        run: cd "$RUNNER_TEMP" && sha256sum -c SHA256SUMS
      - name: Sign build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            ${{ runner.temp }}/barebonesforms-${{ github.ref_name }}.zip
            ${{ runner.temp }}/barebonesforms-${{ github.ref_name }}-upgrade.zip
      - name: Prepare immutable release ownership
        shell: bash
        run: |
          set -euo pipefail
          # Available before creation so cancellation before recording the ID can still recover ownership.
          cat > "$RUNNER_TEMP/release-identity.sh" <<'BASH'
          marker="<!-- bbf-release-run:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT} -->"
          release_list() {
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100"
          }
          owned_id() {
            local ids
            ids=$(release_list | jq -r --arg marker "$marker" '[.[][] | select(.draft == true and (.body // "" | contains($marker))) | .id] | if length == 1 then .[0] else empty end') || return 1
            [[ "$ids" =~ ^[0-9]+$ ]] || return 1
            printf '%s' "$ids"
          }
          owned_release() {
            local release
            [[ "$1" =~ ^[0-9]+$ ]] || return 1
            release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$1") || return 1
            printf '%s' "$release" | jq -e --arg marker "$marker" --arg id "$1" 'select((.id | tostring) == $id and .draft == true and (.body // "" | contains($marker)))'
          }
          cleanup_owned() {
            local id
            # Once saved, never rediscover a different ID, even if the saved release disappeared.
            if [ -f "$RUNNER_TEMP/owned-release-id" ]; then
              id=$(<"$RUNNER_TEMP/owned-release-id")
            else
              id=$(owned_id) || return 0
            fi
            owned_release "$id" >/dev/null || return 0
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          }
          BASH
      - name: Create draft GitHub release
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/release-identity.sh"
          # Queued duplicate runs become no-ops after the first run publishes this tag.
          releases=$(release_list)
          published=$(printf '%s' "$releases" | jq -r --arg tag "$GITHUB_REF_NAME" 'any(.[][]; .tag_name == $tag and .draft == false)')
          if [ "$published" = true ]; then
            echo 'skipped=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          notes="$RUNNER_TEMP/notes.md"
          awk -v head="## [${GITHUB_REF_NAME#v}]" '
            index($0, head) == 1 {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > "$notes"
          [ -s "$notes" ] || echo "See CHANGELOG.md." > "$notes"
          cp "$notes" "$RUNNER_TEMP/draft-notes.md"
          printf '\n%s\n' "$marker" >> "$RUNNER_TEMP/draft-notes.md"
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/barebonesforms-${GITHUB_REF_NAME}.zip" \
            "$RUNNER_TEMP/barebonesforms-${GITHUB_REF_NAME}-upgrade.zip" "$RUNNER_TEMP/SHA256SUMS" \
            --draft --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/draft-notes.md"
          id=$(owned_id)
          owned_release "$id" >/dev/null
          printf '%s' "$id" > "$RUNNER_TEMP/owned-release-id"
      - name: Verify uploaded draft files
        if: ${{ steps.create_release.outputs.skipped != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # What users download must be what was built and attested, not only what crossed between the jobs.
          set -euo pipefail
          source "$RUNNER_TEMP/release-identity.sh"
          id=$(<"$RUNNER_TEMP/owned-release-id")
          release=$(owned_release "$id")
          check="$RUNNER_TEMP/published"
          mkdir "$check"
          for name in "barebonesforms-${GITHUB_REF_NAME}.zip" "barebonesforms-${GITHUB_REF_NAME}-upgrade.zip" SHA256SUMS; do
            asset_id=$(printf '%s' "$release" | jq -er --arg name "$name" '[.assets[] | select(.name == $name) | .id] | if length == 1 then .[0] else error("missing or duplicate asset") end')
            [[ "$asset_id" =~ ^[0-9]+$ ]]
            gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$check/$name"
          done
          cmp "$RUNNER_TEMP/SHA256SUMS" "$check/SHA256SUMS"
          (cd "$check" && sha256sum -c SHA256SUMS)
          owned_release "$id" >/dev/null
      - name: Publish verified draft
        if: ${{ steps.create_release.outputs.skipped != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/release-identity.sh"
          id=$(<"$RUNNER_TEMP/owned-release-id")
          owned_release "$id" >/dev/null
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false -F body=@"$RUNNER_TEMP/notes.md"
      - name: Remove this run's unverified draft
        if: ${{ always() && (failure() || cancelled()) }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # No helper means cancellation happened before draft creation could start.
          [ -f "$RUNNER_TEMP/release-identity.sh" ] || exit 0
          source "$RUNNER_TEMP/release-identity.sh"
          cleanup_owned
