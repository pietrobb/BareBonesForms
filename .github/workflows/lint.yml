name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    name: PHP and JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check every PHP file
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            php -l "$file"
            count=$((count + 1))
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0 | sort -z)
          printf 'PHP syntax: %d files passed\n' "$count"
      - name: Check every JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count + 1))
          done < <(find . -type f -name '*.js' -not -path './vendor/*' -not -path './node_modules/*' -print0 | sort -z)
          printf 'JavaScript syntax: %d files passed\n' "$count"

  g6:
    name: G6 failure-propagating regression gate
    runs-on: ubuntu-latest
    needs: syntax
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run focused local-mock orchestration
        run: php tests/review-ci-test.php

  mysql:
    name: Disposable MariaDB regression gate
    runs-on: windows-latest
    needs: syntax
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
      - name: Install reviewed MariaDB runtime
        shell: powershell
        run: choco install mariadb --version=12.1.2 --yes --no-progress
      - name: Run owned disposable MariaDB matrix
        shell: powershell
        run: php tests/review-access-mysql-test.php
